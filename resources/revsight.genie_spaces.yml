son) unless the user changes them. Never drop the time filter on a follow-up. If no time window is given at all, default to the latest complete month (September 2026) compared with the same month last year (September 2025); never aggregate across all years.\\nAnswer style: return the table, then at most 2 short sentences of insight. Never list individual rows, records, reservations or confirmation numbers in the text; the table already shows them. Never use em dashes or en dashes in answers; use colons, commas or parentheses. When a question matches an example query, answer it directly; do not end with a clarifying question (offer one alternative at most). Round currency to 2 decimals, occupancy as a percentage with 1 decimal, indices with 1 decimal. Always compute ratio KPIs with MEASURE() on the metric view, never by averaging site-level ratios. Data runs through 2026-10-04; \\\"last 8 weeks\\\" means the 8 complete weeks ending 2026-10-03; \\\"this year\\\" means 2026.\\n\\nYou are the Wyndham STR Comp Set agent (weekly grain).\\nTable guide:\\n- ${var.catalog}.${var.schema}.mv_str_compset (metric view): own vs comp set per site per week (week_start = Sunday). Measures: MEASURE(occupancy), MEASURE(adr), MEASURE(revpar), MEASURE(comp_occupancy), MEASURE(comp_adr), MEASURE(comp_revpar), MEASURE(mpi), MEASURE(ari), MEASURE(rgi), MEASURE(site_count). Dimensions: week_start, month, year, site_id, property_name, brand, chain_scale, state, market, region, hurricane_market. Incomplete comp weeks are already excluded by the view; never re-add them.\\n- ${var.catalog}.${var.schema}.dim_site: site attributes.\\n- ${var.catalog}.${var.schema}.anomaly_site_day: detected anomalies; rgi_drop rows are comp-set performance declines.\\nGrain rule: compare at week grain only. If the user asks for daily figures, explain STR is weekly and suggest the NT Performance model.\\nGuardrail: booking channel, rate plan, travel agent / IATA, reservations and pickup do NOT exist at comp-set grain (STR only reports aggregate supply, demand and revenue for the comp set). If asked for any of them \\\"by comp set\\\", do not join or guess. Answer in two sentences: (1) STR reports only aggregate supply, demand and revenue for the comp set, so channel, rate plan and IATA do not exist at that grain; (2) \\\"For your own properties' channel mix, switch the Data model to NT Performance (daily).\\\" Always include that second sentence.\"]}], \"example_question_sqls\": [{\"id\": \"20000000000000000000000000000001\", \"question\": [\"Weekly RGI vs comp set by chain scale, hurricane vs non-hurricane, Aug-Sep 2026\"], \"sql\": [\"SELECT week_start, chain_scale, hurricane_market, MEASURE(rgi) AS rgi, MEASURE(mpi) AS mpi, MEASURE(ari) AS ari\\nFROM ${var.catalog}.${var.schema}.mv_str_compset\\nWHERE week_start BETWEEN DATE'2026-08-02' AND DATE'2026-09-27'\\nGROUP BY ALL ORDER BY week_start, chain_scale, hurricane_market\"]}, {\"id\": \"20000000000000000000000000000002\", \"question\": [\"Weekly RGI vs comp set by brand for Gulf Coast states, Aug-Sep 2026\"], \"sql\": [\"SELECT week_start, brand, chain_scale, MEASURE(occupancy) AS occupancy, MEASURE(adr) AS adr, MEASURE(revpar) AS revpar, MEASURE(comp_revpar) AS comp_revpar, MEASURE(rgi) AS rgi\\nFROM ${var.catalog}.${var.schema}.mv_str_compset\\nWHERE state IN ('FL','TX','LA','MS','AL') AND week_start BETWEEN DATE'2026-08-02' AND DATE'2026-09-27'\\nGROUP BY ALL ORDER BY week_start, chain_scale, brand\"]}, {\"id\": \"20000000000000000000000000000003\", \"question\": [\"Which sites had the largest RevPAR index drop vs comp set in the last 8 weeks?\"], \"sql\": [\"WITH w AS (\\n  SELECT site_id, property_name, market,\\n    CASE WHEN week_start >= DATE'2026-08-09' THEN 'recent' ELSE 'prior' END AS period,\\n    MEASURE(rgi) AS rgi\\n  FROM ${var.catalog}.${var.schema}.mv_str_compset\\n  WHERE week_start BETWEEN DATE'2026-06-14' AND DATE'2026-09-27'\\n  GROUP BY ALL)\\nSELECT site_id, property_name, market,\\n  max(CASE WHEN period = 'prior' THEN rgi END) AS rgi_prior_8wk,\\n  max(CASE WHEN period = 'recent' THEN rgi END) AS rgi_last_8wk,\\n  max(CASE WHEN period = 'recent' THEN rgi END) - max(CASE WHEN period = 'prior' THEN rgi END) AS rgi_change\\nFROM w GROUP BY ALL ORDER BY rgi_change ASC LIMIT 15\"]}, {\"id\": \"20000000000000000000000000000004\", \"question\": [\"Show weekly RGI, MPI and ARI for S01188 vs its comp set from June to September 2026\"], \"sql\": [\"SELECT week_start, MEASURE(revpar) AS revpar, MEASURE(comp_revpar) AS comp_revpar, MEASURE(mpi) AS mpi, MEASURE(ari) AS ari, MEASURE(rgi) AS rgi\\nFROM ${var.catalog}.${var.schema}.mv_str_compset\\nWHERE site_id = 'S01188' AND week_start BETWEEN DATE'2026-06-07' AND DATE'2026-09-27'\\nGROUP BY ALL ORDER BY week_start\"]}, {\"id\": \"20000000000000000000000000000005\", \"question\": [\"RGI by region for September 2026\"], \"sql\": [\"SELECT region, MEASURE(rgi) AS rgi, MEASURE(mpi) AS mpi, MEASURE(ari) AS ari, MEASURE(site_count) AS sites\\nFROM ${var.catalog}.${var.schema}.mv_str_compset\\nWHERE month = DATE'2026-09-01'\\nGROUP BY ALL ORDER BY rgi DESC\"]}]}}"
