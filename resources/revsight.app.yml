resources:
  apps:
    revsight:
      name: ${var.app_name}
      description: "RevSight IQ: Genie revenue explorer on UC metric views"
      source_code_path: ../app
      # Runs as each viewer (user authorization). Keep in sync with setup/user_api_scopes.json.
      # Needs user authorization on in the workspace (else: "user token passthrough not enabled").
      user_api_scopes:
        - genie
        - sql
        - catalog.tables:read
      # No resources: the app's service principal needs no access to the warehouse or Genie agents.
      # Start command and env live here (not in app/app.yaml, which the bundle doesn't upload).
      # The env values fill the ${VAR}s in app/agents.yaml. Applied by `databricks bundle run revsight`.
      config:
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: GENIE_SPACE_NT
            value: ${resources.genie_spaces.nt.id}
          - name: GENIE_SPACE_STR
            value: ${resources.genie_spaces.str.id}
          - name: UC_CATALOG
            value: ${var.catalog}
          - name: UC_SCHEMA
            value: ${var.schema}
